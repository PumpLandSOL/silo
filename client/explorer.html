<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SILO Explorer</title><link rel="icon" href="/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css">
<script type="importmap">{"imports":{
  "@noble/curves/ed25519":"/vendor/curves/esm/ed25519.js",
  "@noble/hashes/_assert":"/vendor/hashes/esm/_assert.js","@noble/hashes/hmac":"/vendor/hashes/esm/hmac.js","@noble/hashes/sha2":"/vendor/hashes/esm/sha2.js",
  "@noble/hashes/sha3":"/vendor/hashes/esm/sha3.js","@noble/hashes/sha512":"/vendor/hashes/esm/sha512.js","@noble/hashes/utils":"/vendor/hashes/esm/utils.js",
  "@noble/hashes/crypto":"/vendor/hashes/esm/crypto.js","@noble/hashes/sha256":"/vendor/hashes/esm/sha256.js","@noble/hashes/blake2s":"/vendor/hashes/esm/blake2s.js",
  "@noble/post-quantum/ml-kem":"/vendor/post-quantum/esm/ml-kem.js"}}</script>
<style>.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 20px;font-size:13px}.kv>span:nth-child(odd){color:var(--dim);font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding-top:3px}.kv code{word-break:break-all}
.stat{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);margin:26px 0}.stat div{padding:16px;border-right:1px solid var(--line)}.stat div:last-child{border-right:0}.stat .v{font:400 32px/1 var(--serif);margin-top:6px}
@media(max-width:820px){.stat{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr}}</style></head><body>
<div class="plate"><section class="sec" style="border-top:0;padding-top:40px">
  <div class="cap">the explorer · <b>everything SILO puts on record</b></div>
  <div class="row" style="margin-top:18px"><input id="q" placeholder="block height, block hash, tx id, key image, or a Robinhood Chain deposit tx" style="flex:1"><button class="btn solid" id="go">search</button></div>
  <div id="view" style="margin-top:20px"></div>
</section></div>
<script type="module">
import { chrome, $, api, eth, weiEth, short, ago, toast } from '/common.js'; import * as K from '/rct.js'; chrome('/explorer');
let S = {}; const V = $('view'), RX = () => S.explorer || 'https://explorer.mainnet.chain.robinhood.com';
const kindTag = (k) => '<span class="tag' + (k === 'private' || k === 'withdraw' ? ' g' : '') + '">' + k + '</span>';
const txRow = (t) => `<tr><td><a href="#/tx/${t.id}"><span class="trunc">${t.id}</span></a></td><td>${kindTag(t.kind)}</td><td>${t.kind === 'deposit' ? eth(t.amount) + ' ETH' : t.kind === 'withdraw' ? eth(t.amount) + ' ETH out' : t.kind === 'fees' ? 'fees' : '<span class="dim">hidden</span>'}</td><td class="hm">${t.ins} in · ${t.outs} out${t.quantum ? ' · ' + t.quantum + ' ML-KEM' : ''}</td><td class="hm dim">${t.h != null ? '#' + t.h : 'mempool'}</td></tr>`;
async function home() { S = await api('/api/stats'); const [bl, tx, ba, de, ex] = await Promise.all([api('/api/blocks?limit=12'), api('/api/txs'), api('/api/batches'), api('/api/deposits'), api('/api/exits')]);
  V.innerHTML = `<div class="stat"><div><div class="cap">height</div><div class="v">${S.height.toLocaleString()}</div></div><div><div class="cap">private txs</div><div class="v">${S.privateTxs}</div></div><div><div class="cap">batches</div><div class="v">${S.batches}</div></div><div><div class="cap">deposits</div><div class="v">${S.deposits}</div></div><div><div class="cap">withdrawals</div><div class="v">${S.exitsPaid}</div></div><div><div class="cap">ETH in rollup</div><div class="v">${weiEth(S.tvlWei)}</div></div></div>
  <div class="grid2"><div class="box"><div class="hd"><span>latest L2 blocks</span><span>every ${S.blockTime}s</span></div><table class="alm"><tbody>${bl.map((b) => `<tr><td class="n"><a href="#/block/${b.height}">${b.height}</a></td><td><span class="trunc" style="max-width:180px">${b.hash}</span></td><td>${b.txs} tx</td><td class="dim hm">${ago(b.ts)}</td></tr>`).join('')}</tbody></table></div>
  <div class="box"><div class="hd"><span>latest transactions</span><span>${tx.mempool.length} in mempool</span></div><table class="alm"><tbody>${[...tx.mempool.map((t) => ({ ...t, h: null })), ...tx.recent].slice(0, 12).map(txRow).join('') || '<tr><td class="dim">no transactions yet</td></tr>'}</tbody></table></div></div>
  <div class="box" style="margin-top:22px"><div class="hd"><span>batches posted to Robinhood Chain</span>${S.rollup ? `<a class="gold" href="${RX()}/address/${S.rollup}" target="_blank" rel="noopener">SiloRollup ${short(S.rollup, 6)} ↗</a>` : ''}</div><table class="alm"><thead><tr><th>batch</th><th>blocks</th><th class="hm">state root</th><th>exits</th><th>Robinhood Chain tx</th></tr></thead><tbody>${ba.map((x) => `<tr><td class="n">${x.n}</td><td>${x.fromBlock}–${x.toBlock}</td><td class="hm"><span class="trunc">${x.stateRoot}</span></td><td>${x.exits}</td><td><a href="${RX()}/tx/${x.l1tx}" target="_blank" rel="noopener">${short(x.l1tx, 8)} ↗</a></td></tr>`).join('') || '<tr><td class="dim" colspan="5">none yet</td></tr>'}</tbody></table></div>
  <div class="grid2" style="margin-top:22px"><div class="box"><div class="hd"><span>deposits · Robinhood Chain → SILO</span><span>public, like every bridge</span></div><table class="alm"><tbody>${de.map((d) => `<tr><td>#${d.id}</td><td>${weiEth(d.wei)} ETH</td><td>${d.bad ? '<span class="tag">' + d.bad + '</span>' : d.minted != null ? '<a href="#/block/' + d.minted + '">minted in #' + d.minted + '</a>' : 'pending'}</td><td><a href="${RX()}/tx/${d.l1tx}" target="_blank" rel="noopener">${short(d.l1tx, 6)} ↗</a></td></tr>`).join('') || '<tr><td class="dim">none yet</td></tr>'}</tbody></table></div>
  <div class="box"><div class="hd"><span>withdrawals · SILO → Robinhood Chain</span><span>paid by the contract</span></div><table class="alm"><tbody>${ex.map((e) => `<tr><td><a href="#/tx/${e.txid.slice(2)}"><span class="trunc" style="max-width:120px">${e.txid}</span></a></td><td>${weiEth(e.amount)} ETH</td><td>${short(e.to, 5)}</td><td>${e.status === 'paid' ? '<a href="' + RX() + '/tx/' + e.l1tx + '" target="_blank" rel="noopener">paid ↗</a>' : '<span class="tag g">next batch</span>'}</td></tr>`).join('') || '<tr><td class="dim">none yet</td></tr>'}</tbody></table></div></div>`; }
async function block(id) { const b = await api('/api/block/' + id); if (b.error) return (V.innerHTML = '<p class="dim">' + b.error + '</p>');
  V.innerHTML = `<h2>Block <em>#${b.height}</em></h2><div class="box" style="margin-top:22px"><div class="bd kv"><span>hash</span><code>${b.hash}</code><span>parent</span><code><a class="gold" href="#/block/${b.height - 1}">${b.prev}</a></code><span>time</span><span>${new Date(b.ts).toISOString()} · ${ago(b.ts)}</span><span>tx root</span><code>${b.txRoot}</code><span>sequencer signature</span><code>${b.sig}</code><span>batch</span><span>${b.batch ? 'posted in batch ' + b.batch : 'waiting for the next batch'}</span><span>fees</span><span>${eth(b.fees)} ETH</span></div></div>
  <div class="box" style="margin-top:22px"><div class="hd"><span>transactions</span><span>${b.tx.length}</span></div><table class="alm"><tbody>${b.tx.map(txRow).join('')}</tbody></table></div>`; }
async function tx(id) { const t = await api('/api/tx/' + id); if (t.error) return (V.innerHTML = '<p class="dim">' + t.error + '</p>');
  const title = { withdraw: 'Withdrawal', deposit: 'Deposit', fees: 'Fee payout', genesis: 'Genesis' }[t.kind] || 'Private transaction';
  V.innerHTML = `<h2>${title}</h2>
  <div class="box" style="margin-top:22px"><div class="bd kv"><span>id</span><code>${t.id}</code><span>block</span><span>${t.h != null ? '<a class="gold" href="#/block/' + t.h + '">#' + t.h + '</a> · ' + t.confirmations + ' confirmations' : 'in mempool'}</span><span>fee</span><span>${eth(t.fee)} ETH</span><span>size</span><span>${(t.size / 1024).toFixed(1)} KB</span>
  ${t.deposit ? `<span>bridged from</span><code>${t.deposit.from}</code><span>amount</span><span>${eth(t.deposit.amount)} ETH</span><span>Robinhood Chain tx</span><code><a class="gold" href="${RX()}/tx/${t.deposit.l1tx}" target="_blank" rel="noopener">${t.deposit.l1tx} ↗</a></code>` : ''}
  ${t.exit ? `<span>exit to</span><code>${t.exit.to}</code><span>exit amount</span><span>${eth(t.exit.amount)} ETH</span><span>status</span><span>${t.exit.status === 'paid' ? 'paid in batch ' + t.exit.batch + ' · <a class="gold" href="' + RX() + '/tx/' + t.exit.l1tx + '" target="_blank" rel="noopener">Robinhood Chain tx ↗</a>' : 'paid in the next batch'}</span>` : ''}
  </div></div>
  ${t.vin.length ? `<div class="box" style="margin-top:22px"><div class="hd"><span>inputs · each hides among 16</span><button class="btn" id="verify" style="padding:6px 12px">verify in your browser</button></div><div class="bd" id="vres" style="padding-bottom:0"></div><table class="alm"><thead><tr><th>key image</th><th>ring members (global output index)</th></tr></thead><tbody>${t.vin.map((v) => `<tr><td><span class="trunc">${v.ki}</span></td><td style="font-size:11px">${v.ring.join(' · ')}</td></tr>`).join('')}</tbody></table></div>` : ''}
  <div class="box" style="margin-top:22px"><div class="hd"><span>outputs</span><span>${t.vin.length ? 'amounts committed, never shown' : 'clear amounts'}</span></div><table class="alm"><thead><tr><th>one-time key</th><th>commitment</th><th>amount</th><th class="hm">detection</th></tr></thead><tbody>${t.vout.map((o) => `<tr><td><span class="trunc" style="max-width:200px">${o.P}</span></td><td><span class="trunc" style="max-width:200px">${o.C}</span></td><td>${o.amount != null ? eth(o.amount) + ' ETH' : '<span class="dim">hidden · ' + o.rangeBits + '-bit range proof</span>'}</td><td class="hm">${o.quantum ? '<span class="tag g">ML-KEM-768 · ' + o.ctBytes + ' B</span>' : '<span class="tag">ECDH</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  const vb = $('verify'); if (vb) vb.onclick = async () => { vb.disabled = true; $('vres').innerHTML = '<p class="dim">fetching the raw transaction and its 16-member rings…</p>'; const r = await api('/api/rawtx/' + t.id);
    if (r.pruned) return ($('vres').innerHTML = '<p class="dim">this transaction is old enough that its signatures were pruned</p>');
    await new Promise((z) => setTimeout(z, 30)); const t0 = performance.now(); const err = K.verifyTx(r.tx, (g) => r.ring[g], () => false);
    $('vres').innerHTML = err ? '<p style="color:var(--red)">✗ ' + err + '</p>' : `<p class="gold" style="margin-bottom:14px">✓ verified on your machine in ${((performance.now() - t0) / 1000).toFixed(2)}s: ring signatures, range proofs and the balance equation all hold.</p>`; }; }
async function route() { const h = location.hash.slice(2).split('/'); try { if (!S.explorer) S = await api('/api/stats'); if (h[0] === 'block') await block(h[1]); else if (h[0] === 'tx') await tx(h[1]); else await home(); } catch (e) { V.innerHTML = '<p class="dim">node unreachable</p>'; } }
addEventListener('hashchange', route); route(); setInterval(() => { if (!location.hash || location.hash === '#/') home().catch(() => {}); }, 6000);
$('go').onclick = async () => { const r = await api('/api/search?q=' + encodeURIComponent($('q').value)); if (r.error) return toast(r.error, true); location.hash = '#/' + r.type + '/' + r.id; };
$('q').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
</script></body></html>
